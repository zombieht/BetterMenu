# GitHub Actions 持续集成配置文件
# 本工作流用于在每次推送或合并请求到 main/master 分支时，自动对 macOS 应用进行构建与打包。

name: CI

# 触发条件：当推送或创建针对 main、master 分支的 PR，或者推送 v 开头的 tag 时触发
on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

# 允许工作流向仓库写入内容，以创建和发布 GitHub Release
permissions:
  contents: write

jobs:
  build:
    name: Build and Package
    runs-on: macos-latest

    steps:
      # 步骤 1：检出仓库代码
      - name: Checkout code
        uses: actions/checkout@v5

      # 步骤 2：检查 Xcode 开发环境（使用运行器默认自带的最新版本）
      - name: Set up Xcode
        run: |
          xcodebuild -version

      # 步骤 2.4：校验代码风格。swift-format 随 Xcode 提供，无需额外安装依赖。
      # --strict 让任何风格告警都以非零退出码结束，把当前统一的排版固化为门禁。
      - name: Lint Formatting
        run: |
          xcrun swift-format lint \
            --configuration .swift-format \
            --recursive \
            --strict \
            BetterMenu BetterMenuFinderSync BetterMenuTests

      # 步骤 2.5：运行安全通信、路径处理与设置迁移单元测试
      - name: Run Tests
        run: |
          TEST_DERIVED_DATA="$RUNNER_TEMP/BetterMenuTestsDerivedData"
          echo "TEST_DERIVED_DATA=$TEST_DERIVED_DATA" >> "$GITHUB_ENV"
          xcodebuild \
            -project BetterMenu.xcodeproj \
            -scheme BetterMenu \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$TEST_DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/BetterMenuTests.xcresult" \
            test

          UNEXPECTED_PRODUCTS="$(
            find "$TEST_DERIVED_DATA/Build/Products" \
              -type d \
              \( -name 'BetterMenu.app' -o -name 'BetterMenuFinderSync.appex' \) \
              -print
          )"
          if [[ -n "$UNEXPECTED_PRODUCTS" ]]; then
            echo "单元测试不应构建或注册 BetterMenu App/Finder Sync 扩展："
            echo "$UNEXPECTED_PRODUCTS"
            exit 1
          fi

      # 步骤 2.55：无论测试通过与否都上传 xcresult 包，失败时可直接下载查看具体失败用例，
      # 不必再依赖日志尾部输出定位问题。
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BetterMenu-TestResults
          path: ${{ runner.temp }}/BetterMenuTests.xcresult
          if-no-files-found: warn
          retention-days: 14

      # 步骤 2.6：安装 create-dmg 以启用精美 DMG 打包布局
      - name: Install create-dmg
        run: |
          brew install create-dmg

      # 步骤 3：运行项目打包脚本进行编译和打包（若失败则输出最后 200 行日志辅助排查）
      - name: Build and Package
        run: |
          chmod +x script/package.sh
          ./script/package.sh > build.log 2>&1 || { echo "=== BUILD FAILED ==="; tail -n 200 build.log; exit 1; }

      # 步骤 3.5：上传完整打包日志。tail -n 200 只能看到尾部，
      # 编译错误常出现在中段，因此把整份日志留作工件。
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BetterMenu-BuildLog
          path: build.log
          if-no-files-found: warn
          retention-days: 14

      # 步骤 4：当推送以 'v' 开头的 tag 时，下载 Sparkle 工具生成 appcast.xml 并对其签名
      - name: Generate Sparkle Appcast
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # 1. 下载 Sparkle 二进制工具包
          curl -L -o sparkle.tar.xz https://github.com/sparkle-project/Sparkle/releases/download/2.9.2/Sparkle-2.9.2.tar.xz
          mkdir sparkle-bin
          tar -xf sparkle.tar.xz -C sparkle-bin

          # 2. 生成并签名 appcast.xml
          # 为防止 SUSparkleErrorDomain Code=1002 (Duplicate updates) 报错，
          # 临时移除非 Sparkle 更新必需的 .dmg 文件（自动更新推荐分发 .zip 包）
          mkdir -p dist-dmg
          mv dist/*.dmg dist-dmg/

          # 通过 stdin 安全传入私钥，供 generate_appcast 进行签名
          echo "${{ secrets.SPARKLE_PRIVATE_KEY }}" | ./sparkle-bin/bin/generate_appcast --ed-key-file - dist/

          # 恢复 .dmg 文件到 dist/ 目录，以供后续步骤打包上传和创建 Release 使用
          mv dist-dmg/*.dmg dist/

      # 步骤 5：上传构建生成的 DMG、ZIP 归档制品以及 appcast.xml
      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: BetterMenu-Release
          path: |
            dist/*.zip
            dist/*.dmg
            dist/appcast.xml

      # 步骤 6：当推送以 'v' 开头的 tag 时，自动创建 GitHub Release 并上传打包制品和 appcast.xml
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip dist/*.dmg dist/appcast.xml \
            --title "${{ github.ref_name }}" \
            --notes "BetterMenu Release ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
